name: MONEY_AGENT #607 direct integration

on:
  push:
    branches:
      - money-agent-607-ci-validation

permissions:
  contents: write

jobs:
  refactor-607:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: money-agent-607-ci-validation
          fetch-depth: 0

      - name: Apply direct solver refactor
        run: python scripts/refactor_607.py

      - name: Install Ruff
        run: pipx install ruff==0.16.2

      - name: Syntax check
        run: |
          python -m py_compile \
            curve_solver.py \
            model/sketch_ref.py \
            model/native_3d.py \
            model/distance.py \
            testing/test_native_3d_sketch.py

      - name: Format new files
        run: |
          ruff format \
            model/native_3d.py \
            testing/test_native_3d_sketch.py

      - name: Lint changed files
        run: |
          ruff check --fix \
            curve_solver.py \
            model/sketch_ref.py \
            model/native_3d.py \
            model/distance.py \
            testing/test_native_3d_sketch.py
          ruff check \
            curve_solver.py \
            model/sketch_ref.py \
            model/native_3d.py \
            model/distance.py \
            testing/test_native_3d_sketch.py

      - name: Remove one-shot files and commit refactor
        run: |
          rm scripts/refactor_607.py
          rm .github/workflows/money-agent-607-refactor.yml
          git config user.name "money-agent-bot"
          git config user.email "64386813+franklincg@users.noreply.github.com"
          git add -A
          git commit -m "Integrate native 3D path into CurveSolver"
          git push origin HEAD:money-agent-607-ci-validation
